<!DOCTYPE html>
<html>
<head>
<title>HCLTech Navbar</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

/* Navbar */
.navbar{
    background:#0078c8;
    display:flex;
    justify-content:center;
    padding:15px;
}

/* Links */
.navbar a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-weight:bold;
}

.navbar a:hover{
    text-decoration:underline;
}

/* Content */
.content{
    text-align:center;
    padding:40px;
}
</style>

</head>
<body>

<div class="navbar">
    <a href="https://www.hcltech.com/" target="_blank">Home</a>
    <a href="https://www.hcltech.com/about-us" target="_blank">About</a>
    <a href="https://www.hcltech.com/services" target="_blank">Services</a>
    <a href="https://www.hcltech.com/industries" target="_blank">Industries</a>
    <a href="https://www.hcltech.com/insights" target="_blank">Insights</a>
    <a href="https://www.hcltech.com/careers" target="_blank">Careers</a>
    <a href="https://www.hcltech.com/newsroom" target="_blank">Newsroom</a>
    <a href="https://www.hcltech.com/contact-us" target="_blank">Contact</a>
</div>

<div class="content">
    <h2>Welcome to HCLTech</h2>
    <p>Click any menu item to open the page</p>
</div>

</body>
</html>
